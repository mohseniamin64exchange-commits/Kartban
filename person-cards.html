 {bank:'بانک ملی ایران',en:'BANK MELLI IRAN',type:'melli',logo:'ملی',number:'6037 9975 2468 9876',iban:'IR170170000000987654321001',account:'۹۸۷۶۵۴۳۲۱',color:['#071b58','#1d70c8']},
 {bank:'بانک صادرات',en:'BANK SADERAT IRAN',type:'saderat',logo:'صادرات',number:'5892 1011 2233 1234',iban:'IR190170000000112233445501',account:'۱۱۲۲۳۳۴۴۵۵',color:['#045e7e','#19c3d9']}
];
function cardMarkup(c,i){return `<article class="bank-card ${c.type}" data-index="${i}"><input class="card-select" type="checkbox" aria-label="انتخاب ${c.bank}"><div class="card-inner"><div class="bank-head"><div class="bank-emblem">${c.logo}</div><div><div class="bank-title">${c.bank}</div><div class="bank-en">${c.en}</div></div></div><div class="chip"></div><div class="card-number">${c.number}</div><div class="card-details"><div class="card-detail account">${c.account}</div><div class="card-detail iban">${c.iban}</div></div><div class="card-actions"><button class="copy-btn" data-copy="${c.iban}">▣ کپی شبا</button><span class="type-tag">کارت بانکی</span></div></div></article>`}
$('#cards').innerHTML=DATA.map(cardMarkup).join('');
function selected(){return [...document.querySelectorAll('.card-select:checked')].map(x=>DATA[Number(x.closest('.bank-card').dataset.index)])}
function update(){document.querySelectorAll('.bank-card').forEach(c=>c.classList.toggle('selected',c.querySelector('.card-select').checked));$('#floatingSend').style.opacity=selected().length?'1':'.7'}
function toast(text){const t=$('#toast');t.textContent=text;t.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.remove('show'),1700)}
function shareText(cards){return cards.map(c=>`${c.bank}\nنام صاحب کارت: ${person}\nشماره کارت: ${c.number}\n${c.iban}\n${c.account}`).join('\n\n')}
async function cardFile(card,index){const canvas=document.createElement('canvas');canvas.width=1251;canvas.height=811;const x=canvas.getContext('2d');const g=x.createLinearGradient(0,0,1251,811);g.addColorStop(0,card.color[0]);g.addColorStop(1,card.color[1]);x.fillStyle=g;x.fillRect(0,0,1251,811);x.fillStyle='rgba(255,255,255,.08)';x.beginPath();x.arc(145,62,378,0,Math.PI*2);x.fill();x.fillStyle='#fff';x.textAlign='center';x.direction='rtl';x.font='700 54px Tahoma';x.fillText(card.bank,625,125);x.font='24px Segoe UI';x.fillText(card.en,625,170);x.fillStyle='#efd07b';x.fillRect(95,214,144,110);x.strokeStyle='#a57e2e';x.lineWidth=3;x.strokeRect(95,214,144,110);x.textAlign='center';x.direction='ltr';x.fillStyle='#fff';x.font='600 53px Segoe UI';x.fillText(card.number,625,440);x.textAlign='center';x.direction='rtl';x.font='30px Tahoma';x.fillText(person,625,596);x.font='23px Tahoma';x.fillText(card.account,625,675);x.fillText(card.iban,625,730);return new Promise(resolve=>canvas.toBlob(b=>resolve(new File([b],`kartyar-${card.type}-${index+1}.png`,{type:'image/png'})),'image/png'))}
function openShare(){if(!selected().length){toast('ابتدا یک یا چند کارت را انتخاب کنید');return}$('#shareSheet').hidden=false}
$('#cards').addEventListener('change',e=>{if(e.target.matches('.card-select'))update()});$('#cards').addEventListener('click',e=>{if(e.target.closest('.copy-btn'))toast('شماره شبا کپی شد')});$('#floatingSend').onclick=openShare;$('#cancelShare').onclick=()=>$('#shareSheet').hidden=true;
$('#smsShare').onclick=()=>{const text=shareText(selected());$('#shareSheet').hidden=true;location.href='sms:?body='+encodeURIComponent(text)};
$('#mediaShare').onclick=async()=>{const cards=selected(),files=[];for(let i=0;i<cards.length;i++)files.push(await cardFile(cards[i],i));$('#shareSheet').hidden=true;if(navigator.share&&navigator.canShare&&navigator.canShare({files})){await navigator.share({files,title:'کارت‌یار',text:'اطلاعات کارت بانکی'}).catch(()=>{})}else{files.forEach(file=>{const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=file.name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)});toast('تصویر کارت آماده شد')}};
$('#addTitle').textContent='افزودن کارت جدید';const BANK_META={mellat:{bank:'بانک ملت',en:'BANK MELLAT',type:'mellat',logo:'ملت',color:['#80142a','#ff5b71']},melli:{bank:'بانک ملی ایران',en:'BANK MELLI IRAN',type:'melli',logo:'ملی',color:['#071b58','#1d70c8']},saderat:{bank:'بانک صادرات',en:'BANK SADERAT IRAN',type:'saderat',logo:'صادرات',color:['#045e7e','#19c3d9']}};$('#addCard').onclick=()=>{$('#addCardSheet').hidden=false;$('#newNumber').focus()};$('#closeAdd').onclick=()=>$('#addCardSheet').hidden=true;$('#addCardForm').onsubmit=e=>{e.preventDefault();const type=$('#newBank').value,meta=BANK_META[type],card={...meta,kind:$('#newCardKind').value,number:$('#newNumber').value.trim(),account:$('#newAccount').value.trim(),iban:$('#newIban').value.trim(),cvv:$('#newCvv').value,expiry:$('#newExpiry').value};DATA.push(card);$('#cards').insertAdjacentHTML('beforeend',cardMarkup(card,DATA.length-1));$('#addCardSheet').hidden=true;$('#addCardForm').reset();$('.meta').textContent=DATA.length.toLocaleString('fa-IR')+' کارت بانکی';toast('کارت جدید به پروفایل اضافه شد')};
$('#back').onclick=()=>location.href='index.html';update();
</script></body></html>
